# Builds AppTime for Windows and macOS and attaches both to a GitHub Release.
#
# Release: push a version tag, e.g.  git tag v1.3.0 && git push origin v1.3.0
# Test build only (no release): run this workflow by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the server certificate is present
        shell: bash
        run: |
          if [ ! -f server_cert.pem ]; then
            echo "::error::server_cert.pem is missing. Without it community sharing is disabled. See server/README.md step 3."
            exit 1
          fi

      - name: Install
        run: pip install pyinstaller==6.11.1 -r requirements.txt

      - name: Self-test (source)
        run: python apptime.py --selftest

      - name: Build
        run: >
          pyinstaller --onefile --noconsole --name AppTime
          --icon assets/AppTime.ico --version-file version_info.txt
          --hidden-import pystray._win32
          --add-data "dashboard.html;." --add-data "server_cert.pem;." --add-data "assets;assets"
          apptime.py

      - name: Self-test (built app)
        shell: pwsh
        run: |
          $p = Start-Process dist/AppTime.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AppTime.exe --selftest failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import apptime; print(apptime.APP_VERSION)"
          & $iscc "/DMyVersion=$version" installer\AppTime.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test installer (install, check, uninstall)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\AppTime"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AppTime.lnk"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F3A2C4E-9B1D-4E7A-A5C2-3D8E1F0B7A94}_is1"
          $p = Start-Process dist\AppTime-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          foreach ($path in "$app\AppTime.exe", "$app\unins000.exe", $shortcut, $uninstallKey) {
            if (-not (Test-Path $path)) { throw "Missing after install: $path" }
          }
          "Installed: " + (Get-ItemProperty $uninstallKey).DisplayName + " " + (Get-ItemProperty $uninstallKey).DisplayVersion
          $t = Start-Process "$app\AppTime.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed AppTime failed its self-test" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          foreach ($path in "$app\AppTime.exe", $shortcut, $uninstallKey) {
            if (Test-Path $path) { throw "Still there after uninstall: $path" }
          }
          "Install and uninstall OK"

      - name: Test in-app update (install, Update now, restart, uninstall)
        run: python tests/update_e2e.py dist/AppTime-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/AppTime.exe
            dist/AppTime-Setup.exe

  macos:
    runs-on: macos-latest  # Apple Silicon (M1 and newer)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyinstaller==6.11.1 -r requirements.txt

      - name: Self-test (source)
        run: python apptime.py --selftest

      - name: Build
        run: >
          pyinstaller --windowed --name AppTime
          --icon assets/AppTime.icns --osx-bundle-identifier com.husniheartnet.apptime
          --hidden-import pystray._darwin
          --add-data "dashboard.html:." --add-data "server_cert.pem:." --add-data "assets:assets"
          apptime.py

      - name: Make it a menu bar app and sign it (ad hoc)
        run: |
          plutil -insert LSUIElement -bool YES dist/AppTime.app/Contents/Info.plist
          VERSION=$(python -c "import apptime; print(apptime.APP_VERSION)")
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/AppTime.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/AppTime.app/Contents/Info.plist
          codesign --force --deep --sign - dist/AppTime.app

      - name: Self-test (built app)
        run: dist/AppTime.app/Contents/MacOS/AppTime --selftest

      - name: Zip (used by in-app updates)
        run: ditto -c -k --keepParent dist/AppTime.app AppTime-mac.zip

      - name: Disk image (what people download)
        run: |
          mkdir dmg
          cp -R dist/AppTime.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname AppTime -srcfolder dmg -ov -format UDZO AppTime.dmg
          hdiutil attach -nobrowse -mountpoint /tmp/apptime-dmg AppTime.dmg
          test -x /tmp/apptime-dmg/AppTime.app/Contents/MacOS/AppTime
          test -L /tmp/apptime-dmg/Applications
          hdiutil detach /tmp/apptime-dmg
          echo "Disk image OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            AppTime-mac.zip
            AppTime.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/AppTime-Setup.exe
            macos/AppTime.dmg
            macos/AppTime-mac.zip
          generate_release_notes: true
