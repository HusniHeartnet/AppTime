# Builds AppTime (Rust) for Windows and macOS, tests both, and attaches the
# Windows installer and the Mac disk image to a GitHub Release.
#
# Release: push a version tag, e.g.  git tag v2.0.0 && git push origin v2.0.0
# Test build only (no release): push to the v2 branch, or run it from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Unit tests
        working-directory: rust
        run: cargo test --release

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Self-test (built app)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust\target\release\AppTime.exe dist\AppTime.exe
          $out = & dist\AppTime.exe --selftest | Out-String
          $out
          if ($out -notmatch "selftest OK") { throw "selftest failed" }
          "AppTime.exe: {0:N1} MB" -f ((Get-Item dist\AppTime.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path rust\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyVersion=$version" installer\AppTime.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test installer (install, check, uninstall)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\AppTime"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AppTime.lnk"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F3A2C4E-9B1D-4E7A-A5C2-3D8E1F0B7A94}_is1"
          $p = Start-Process dist\AppTime-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          foreach ($path in "$app\AppTime.exe", "$app\unins000.exe", $shortcut, $uninstallKey) {
            if (-not (Test-Path $path)) { throw "Missing after install: $path" }
          }
          "Installed: " + (Get-ItemProperty $uninstallKey).DisplayName + " " + (Get-ItemProperty $uninstallKey).DisplayVersion
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          foreach ($path in "$app\AppTime.exe", $shortcut, $uninstallKey) {
            if (Test-Path $path) { throw "Still there after uninstall: $path" }
          }
          "Install and uninstall OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test in-app update (install, Update now, restart, uninstall)
        run: python tests/update_e2e.py dist/AppTime-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/AppTime-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Unit tests
        working-directory: rust
        run: cargo test --release

      - name: Build (Apple Silicon + Intel)
        working-directory: rust
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../dist
          lipo -create -output ../dist/AppTime \
            target/aarch64-apple-darwin/release/AppTime target/x86_64-apple-darwin/release/AppTime

      - name: Make AppTime.app (menu bar app, signed ad hoc)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          APP=dist/AppTime.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          mv dist/AppTime "$APP/MacOS/AppTime"
          cp assets/AppTime.icns "$APP/Resources/AppTime.icns"
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AppTime</string>
            <key>CFBundleDisplayName</key><string>AppTime</string>
            <key>CFBundleIdentifier</key><string>com.husniheartnet.apptime</string>
            <key>CFBundleExecutable</key><string>AppTime</string>
            <key>CFBundleIconFile</key><string>AppTime</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Info.plist"
          codesign --force --deep --sign - dist/AppTime.app
          lipo -info "$APP/MacOS/AppTime"

      - name: Self-test (built app)
        run: |
          OUT=$(dist/AppTime.app/Contents/MacOS/AppTime --selftest)
          echo "$OUT"
          echo "$OUT" | grep -q "selftest OK"
          du -sh dist/AppTime.app

      - name: Zip (used by in-app updates)
        run: ditto -c -k --keepParent dist/AppTime.app AppTime-mac.zip

      - name: Disk image (what people download)
        run: |
          mkdir dmg
          cp -R dist/AppTime.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname AppTime -srcfolder dmg -ov -format UDZO AppTime.dmg
          hdiutil attach -nobrowse -mountpoint /tmp/apptime-dmg AppTime.dmg
          test -x /tmp/apptime-dmg/AppTime.app/Contents/MacOS/AppTime
          test -L /tmp/apptime-dmg/Applications
          hdiutil detach /tmp/apptime-dmg
          echo "Disk image OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            AppTime-mac.zip
            AppTime.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/AppTime-Setup.exe
            macos/AppTime.dmg
            macos/AppTime-mac.zip
          generate_release_notes: true
